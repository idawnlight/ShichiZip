name: Xcode Preview Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    environment: development
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 27.2 RC
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.2_Release_Candidate.app/Contents/Developer
            cache_key: xcode-27.2-rc
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      XCODE_PROJECT: ShichiZip.xcodeproj
      XCODE_CONFIGURATION: Debug
      XCODE_DERIVED_DATA_PATH: build/DerivedData/ShichiZipZS-${{ matrix.cache_key }}

    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply vendor patches
        run: |
          sh vendor/apply_7zip_patches.sh vendor/7zip
          sh vendor/apply_7zip_patches.sh vendor/7zip-zstd

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          version: 0.16.0
          cache-key: zs-aarch64-native-${{ matrix.cache_key }}

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build archive core artifacts
        run: |
          zig build lib \
            -Dvariant=zs \
            -Dtarget=aarch64-native \
            -Doptimize=ReleaseFast \
            -p build \
            --summary all \
            --verbose

          zig build sfx \
            -Dvariant=zs \
            -Doptimize=ReleaseSmall \
            -p build \
            --summary all \
            --verbose

      - name: Configure signing mode
        id: signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERTIFICATE_P12_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$SIGNING_IDENTITY" ]]; then
            echo "has_certificate=true" >> "$GITHUB_OUTPUT"
            echo "code_sign_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
            echo "development_team=${APPLE_TEAM_ID:-}" >> "$GITHUB_OUTPUT"
            echo "Using imported signing certificate."
          else
            echo "has_certificate=false" >> "$GITHUB_OUTPUT"
            echo "code_sign_identity=-" >> "$GITHUB_OUTPUT"
            echo "development_team=" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are unavailable; using ad-hoc signing for validation."
          fi

      - name: Install signing certificate
        if: steps.signing.outputs.has_certificate == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

      - name: Build and sign app bundle
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme ShichiZipZS \
            -configuration "$XCODE_CONFIGURATION" \
            -derivedDataPath "$XCODE_DERIVED_DATA_PATH" \
            -arch arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.code_sign_identity }}" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.development_team }}" \
            build

      - name: Verify app bundle signature
        run: |
          app_path="${XCODE_DERIVED_DATA_PATH}/Build/Products/${XCODE_CONFIGURATION}/ShichiZip ZS.app"

          test -d "$app_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme ShichiZipZS \
            -configuration "$XCODE_CONFIGURATION" \
            -derivedDataPath "$XCODE_DERIVED_DATA_PATH" \
            -arch arm64 \
            "-only-testing:ShichiZipZSTests" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.code_sign_identity }}" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.development_team }}" \
            test

      - name: Run UI tests
        run: |
          # Persist info/debug os_log entries so they survive until log show
          sudo log config --subsystem ee.dawn.ShichiZipZS --mode level:debug || true

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme ShichiZipZS \
            -configuration "$XCODE_CONFIGURATION" \
            -derivedDataPath "$XCODE_DERIVED_DATA_PATH" \
            -arch arm64 \
            "-only-testing:ShichiZipZSUITests" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.code_sign_identity }}" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.development_team }}" \
            test

      - name: Collect all test diagnostics
        if: ${{ always() }}
        run: |
          diagnostics_dir="build/test-diagnostics/ShichiZipZS-arm64-${{ matrix.cache_key }}"
          test_logs_dir="$XCODE_DERIVED_DATA_PATH/Logs/Test"
          diagnostic_reports_dir="$diagnostics_dir/DiagnosticReports"

          mkdir -p "$diagnostics_dir" "$diagnostic_reports_dir"

          if [[ -d "$test_logs_dir" ]]; then
            ditto "$test_logs_dir" "$diagnostics_dir/TestLogs"
          fi

          for source_dir in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
            [[ -d "$source_dir" ]] || continue
            find "$source_dir" -type f \( \
              -name "*.crash" -o \
              -name "*.hang" -o \
              -name "*.ips" -o \
              -name "*.spin" -o \
              -name "*spindump*" \
            \) -print0 | while IFS= read -r -d '' report; do
              cp -p "$report" "$diagnostic_reports_dir/$(basename "$report")"
            done
          done

          log show --predicate 'subsystem BEGINSWITH "ee.dawn.ShichiZip"' \
            --info --debug --last 30m --style compact \
            > "$diagnostics_dir/app-unified-log.txt" 2>&1 || true

          ls -laR "$HOME/Library/Saved Application State"/ee.dawn.ShichiZip*.savedState/ \
            > "$diagnostics_dir/saved-application-state.txt" 2>&1 || true

      - name: Upload all test diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-diagnostics-ShichiZipZS-arm64-${{ matrix.cache_key }}-${{ github.run_attempt }}
          path: build/test-diagnostics/ShichiZipZS-arm64-${{ matrix.cache_key }}
          if-no-files-found: warn
